/* Bomba AV11 profile block — part of layout, never an overlay */
.bomba-profile-block{
  position:relative !important;
  z-index:2;
  width:100%;
  box-sizing:border-box;
  margin:0 0 14px 0;
  padding:14px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
  overflow:hidden;
}
.bomba-profile-title{
  font-size:16px;
  font-weight:800;
  line-height:1.2;
  margin:0 0 4px;
}
.bomba-profile-name{
  font-size:13px;
  opacity:.78;
  margin:0 0 10px;
}
.bomba-profile-photo{
  width:100%;
  height:92px;
  box-sizing:border-box;
  border:1px dashed rgba(255,255,255,.28);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.45);
  font-size:12px;
  background:rgba(0,0,0,.12);
}

/* ===== Account-specific full-screen backgrounds — corrected ===== */
html, body { min-height:100%; }
body {
  position: relative;
  margin: 0;
  overflow-x: hidden;
  background: #17202a !important;
}
/* The first layer fills the screen; the second layer shows the ENTIRE artwork without distortion. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background-image: var(--account-bg, none);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: blur(18px) brightness(.48) saturate(.75);
  transform: scale(1.05);
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image: var(--account-bg, none);
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
}
#login { position:relative; z-index:2; }
#app { position:relative; z-index:1; background:transparent !important; }
.main, .content, .app { background:transparent !important; }

/* Panels stay readable; the picture remains visible around and between them. */
.topbar {
  background:rgba(255,255,255,.94) !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
}
.card, .stat, .table-card, .toolbar, .panel, .section {
  background:rgba(255,255,255,.94) !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
}
.table-card { overflow:hidden; }
th { background:rgba(248,250,252,.97) !important; }
tr:hover td { background:#f5f8fc !important; }
.sidebar {
  background:rgba(16,24,40,.94) !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
}

/* ALL buttons are transparent, but their text/icons remain fully opaque and readable. */
button, .btn, .btn.primary, .btn.danger, .btn.ghost, .btn.delete-timer,
.nav button, .nav button:hover, .nav button.active, .close {
  background:transparent !important;
  box-shadow:none !important;
}
.btn { color:#263243 !important; }
.btn.primary { color:#1d4ed8 !important; }
.btn.danger, .btn.delete-timer { color:#b91c1c !important; }
.close { color:#263243 !important; }
.nav button { color:#d0d5dd !important; }
.nav button:hover, .nav button.active { color:#fff !important; }
button:hover, .btn:hover, .nav button:hover, .nav button.active {
  background:rgba(37,99,235,.10) !important;
}
.sidebar button:hover, .sidebar .nav button:hover, .sidebar .nav button.active {
  background:rgba(255,255,255,.10) !important;
}

/* Inputs are not buttons: keep them solid enough for reliable reading/editing. */
input, select, textarea {
  background:rgba(255,255,255,.97) !important;
  color:#17202a !important;
}

/* Login remains intentionally solid/readable. */
.login { background:transparent !important; }
.login-card { position:relative; z-index:3; background:rgba(255,255,255,.97) !important; }

/* Document/editor areas should remain usable and are not part of the decorative background. */
.document-shell, .template-stage, .editor-panel { background:rgba(255,255,255,.96) !important; }

function getEmbeddedTemplateConfig(){
 try{const el=document.getElementById('embeddedTemplateConfig'); if(!el)return null; const t=(el.textContent||'').trim(); if(!t||t==='null')return null; const cfg=JSON.parse(t); return cfg&&typeof cfg==='object'?cfg:null;}catch(e){return null;}
}
function getLayout(){
 try{
  const embedded=getEmbeddedTemplateConfig();
  const savedRaw=localStorage.getItem('av_doc_layout');
  const deletedRaw=localStorage.getItem('av_deleted_layout_fields');
  // Browser-local settings take priority after import/edit.
  // The embedded config is used only when no local settings exist (e.g. a freshly opened saved HTML).
  const saved=savedRaw?JSON.parse(savedRaw):(embedded?.layout||null);
  const deleted=deletedRaw?JSON.parse(deletedRaw):(embedded?.deletedFields||[]);
  const out=JSON.parse(JSON.stringify(DEFAULT_FIELD_LAYOUT));
  if(saved&&typeof saved==='object'){
   Object.keys(saved).forEach(k=>{out[k]=out[k]?{...out[k],...saved[k]}:{...saved[k]}})
  }
  (Array.isArray(deleted)?deleted:[]).forEach(k=>delete out[k]);
  return out;
 }catch(e){return JSON.parse(JSON.stringify(DEFAULT_FIELD_LAYOUT))}
}

async function uploadTemplate(event){

 const file=input&&input.files&&input.files[0];
 if(!file)return;
 const status=document.getElementById('templateUploadStatus');
 const setStatus=(t)=>{if(status)status.textContent=t;};
 try{
  setStatus('Загрузка шаблона…');
  let dataUrl='';
  if(file.type==='application/pdf' || /\.pdf$/i.test(file.name)){
   setStatus('Обработка PDF…');
   const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
   pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
   const buffer=await file.arrayBuffer();
   const pdf=await pdfjs.getDocument({data:buffer}).promise;
   const page=await pdf.getPage(1);
   const base=page.getViewport({scale:1});
   const targetWidth=794;
   const viewport=page.getViewport({scale:targetWidth/base.width});
   const canvas=document.createElement('canvas');
   canvas.width=Math.ceil(viewport.width); canvas.height=Math.ceil(viewport.height);
   const ctx=canvas.getContext('2d',{alpha:false});
   await page.render({canvasContext:ctx,viewport}).promise;
   dataUrl=canvas.toDataURL('image/png');
  }else if(file.type.startsWith('image/')){
   dataUrl=await new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result));
    r.onerror=reject;
    r.readAsDataURL(file);
   });
  }else{
   throw new Error('unsupported');
  }
  localStorage.setItem('av_template_background',dataUrl);
  const img=document.getElementById('templateBackground');
  if(img)img.src=dataUrl;
  setStatus('Шаблон загружен. Не забудьте нажать «Сохранить в HTML», если хотите встроить его в файл.');
  log('Изменение шаблона бланка',file.name,'','Новый фон A4 установлен');
 }catch(err){
  console.error('uploadTemplate:',err);
  setStatus('Ошибка загрузки шаблона: '+(err&&err.message?err.message:'неизвестная ошибка'));
  alert('Не удалось загрузить шаблон бланка. Проверьте формат файла и попробуйте ещё раз.');
 }finally{
  if(input)input.value='';
 }
}

function deleteTemplateField(k){
  if(state.user.login!=='admin')return;
  const l=getLayout(), target=l[k];
  if(!target)return;
  if(Object.keys(DEFAULT_FIELD_LAYOUT).includes(k)){
    alert('Стандартное поле нельзя удалить. Его можно только изменить или скрыть через настройки.');
    return;
  }
  const root=getTransferRoot(k);
  const group=getTransferFields(root);
  const removeKeys=(group.length>1 && k===root)?group.map(([key])=>key):[k];
  const label=target.label;
  removeKeys.forEach(key=>delete l[key]);
  // Re-number remaining continuation fields in the same chain.
  if(group.length>1 && k!==root){
    const remain=getTransferFields(root);
    remain.forEach(([key],i)=>{
      l[key].transferRoot=root;
      l[key].transferOrder=i+1;
      if(i===0){l[key].continuationOf=null;}else{l[key].continuationOf=root;}
    });
  }
  saveLayout(l);
  const keys=Object.keys(l);
  window.selectedTemplateField=keys.length?keys[0]:null;
  renderTemplate(document.getElementById('content'));
  if(window.selectedTemplateField)selectTemplateField(window.selectedTemplateField);
  log('Удаление поля',label,'','Удалено поле: '+k);
}

function findFittingPrefix(text,l){
 const t=String(text??'');
 if(!t)return {text:'',rest:''};
 if(textFitsField(t,l))return {text:t,rest:''};
 let lo=1,hi=t.length,best=0;
 while(lo<=hi){
   const mid=Math.floor((lo+hi)/2);
   if(textFitsField(t.slice(0,mid),l)){best=mid;lo=mid+1;}else hi=mid-1;
 }
 if(best<=0)return {text:'',rest:t};
 const boundary=t[best-1]||'';
 if(/\s/.test(boundary)){
   let end=best;
   while(end>0 && /\s/.test(t[end-1]))end--;
   return {text:t.slice(0,end),rest:t.slice(best)};
 }

 // а исходный символ повторяется первым символом следующего поля.
 let dashEnd=best;
 while(dashEnd>0 && !textFitsField(t.slice(0,dashEnd-1)+'-',l))dashEnd--;

function normalizeDate(v){
 if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
 if(typeof v==='number'&&isFinite(v)){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;}
 let str=String(v??'').trim();
 let m=str.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
 if(m)return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
 m=str.match(/^(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})/);
 return m?`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`:'';
}

function importWalletFile(input){
 const file=input.files?.[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=e=>{try{
  if(typeof XLSX==='undefined')throw new Error('Не удалось загрузить Excel-модуль');
  const wb=XLSX.read(e.target.result,{type:'array',cellDates:true,raw:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  if(matrix.length<9)throw new Error('Excel-файл не содержит строки с данными.');

  // Формат отчёта «Информация для кошелька» фиксированный:
  // строка 7: G = Дата, H = № чека;
  // строка 8: J = Код, K = Наименование, P = Кол-во, Q = Цена,
  // R = Сумма, S = Ранг, T:AA = остальные поля.
  // ВАЖНО: не ищем «Дата»/«№ чека» по названию — в этом отчёте
  // заголовок двухуровневый, поэтому используем реальные позиции.
  const map={
   date:6,receipt:7,code:9,product:10,quantity:15,price:16,sum:17,rank:18,
   receiptDuration:19,illiquid:20,supplier:21,services:22,dayTotal:23,
   terminal:24,it:25,promotions:26
  };

  // Небольшая проверка именно содержимого отчёта, но без отказа из-за
  // отличий в написании заголовков. Если строка 7/8 существует, работаем
  // по фиксированным координатам выше.
  const top=matrix[6]||[], bottom=matrix[7]||[];
  if(top.length<=7 || bottom.length<=10){
   throw new Error('Не найдены строки заголовков отчёта (ожидаются строки 7 и 8).');
  }

  const data=matrix.slice(8).filter(r=>r.some(v=>String(v??'').trim()!==''));
  const get=(r,k)=>map[k]>=0?(r[map[k]]??''):'';
  const amount=r=>Number(String(get(r,'sum')).replace(/\s/g,'').replace(',','.'))||0;
  const byDateCode=new Map(),byDateReceipt=new Map();
  for(const r of data){
   const d=normalizeDate(get(r,'date')),c=normalizeCode(get(r,'code')),q=normalizeReceipt(get(r,'receipt'));
   if(!d||!c)continue;
   const ck=d+'|'+c;if(!byDateCode.has(ck))byDateCode.set(ck,[]);byDateCode.get(ck).push(r);
   if(q){const rk=d+'|'+q;if(!byDateReceipt.has(rk))byDateReceipt.set(rk,[]);byDateReceipt.get(rk).push(r);}
  }

  let matched=0,receiptExpanded=0,unmatched=0;
  state.walletRows=[];
  for(const sale of state.sales){
   // Для каждой продажи сохраняем её аккаунт отдельно. Excel не содержит
   // колонку аккаунта, поэтому принадлежность Bosch/Haier определяется
   // исключительно самой продажей, а не последней импортированной строкой.
   const saleCode=normalizeCode(sale.code);
   const candidateDates=[normalizeDate(sale.date),normalizeDate(sale.dateISO),normalizeDate(sale.dateTime)].filter(Boolean);
   const uniqueDates=[...new Set(candidateDates)];
   if(!saleCode||!uniqueDates.length){sale.walletMatched=false;unmatched++;continue;}

   // 1) Сначала ищем товар строго по КОДУ + ДАТЕ.
   // Проверяем все сохранённые представления даты продажи, чтобы Bosch
   // не терялся из-за различия локальной даты и ISO/UTC даты.
   let primaryRows=[];
   for(const d of uniqueDates){
    const rows=byDateCode.get(d+'|'+saleCode)||[];
    if(rows.length) primaryRows.push(...rows);
   }
   // Убираем возможные дубли одной и той же Excel-строки.
   primaryRows=[...new Set(primaryRows)];
   if(!primaryRows.length){sale.walletMatched=false;unmatched++;continue;}

   let saleAdded=0;
   for(const primary of primaryRows){
    // 2) Только после найденного основного товара берём № чека.
    const primaryDate=normalizeDate(get(primary,'date')) || uniqueDates[0];
    const receipt=normalizeReceipt(get(primary,'receipt'));
    // 3) Все товары этого же чека в тот же день, который указан у основной строки Excel.
    const group=receipt?(byDateReceipt.get(primaryDate+'|'+receipt)||[primary]):[primary];
    // 4) Основной товар всегда первым, остальные — по убыванию суммы.
    const rest=group.filter(r=>r!==primary).slice().sort((a,b)=>amount(b)-amount(a));
    const ordered=[primary,...rest];
    const groupId=String(sale.id)+'|'+primaryDate+'|'+receipt;
    ordered.forEach((r,i)=>state.walletRows.push(newWalletRowFromSheet(r,map,sale,groupId,i===0?'primary':'additional')));
    saleAdded+=ordered.length;
    receiptExpanded+=rest.length;
   }
   if(saleAdded){
    sale.walletMatched=true;
    // Сохраняем полный снимок товаров именно этой продажи ещё до архивации.
    // Это гарантирует, что просмотр архива не зависит от повторного поиска по номеру чека.
    sale.walletSnapshot=state.walletRows.filter(r=>String(r.saleId)===String(sale.id)).map(r=>({...r}));
    matched+=saleAdded;
   }else{sale.walletMatched=false;sale.walletSnapshot=[];unmatched++;}
  }

  state.walletLastUpdated=new Date().toISOString();
  localStorage.setItem('av_wallet_last_updated',state.walletLastUpdated);
  save();
  log('Актуализация кошелька',file.name,'',`Заполнено строк: ${matched}; добавлено товаров из тех же чеков: ${receiptExpanded}; без совпадения: ${unmatched}`);
  renderWallet(document.getElementById('content'));
  alert(`Актуализация завершена.\nЗаполнено строк: ${matched}\nДобавлено товаров из тех же чеков: ${receiptExpanded}\nБез совпадения по коду + дате: ${unmatched}`);
 }catch(err){console.error(err);alert('Ошибка Excel: '+err.message)}};
 reader.readAsArrayBuffer(file);input.value='';
}

function getWalletLastUpdatedDisplay(){

 if(!raw)return {text:'Данные ещё не актуализировались',today:false};
 const d=new Date(raw); if(Number.isNaN(d.getTime()))return {text:raw,today:false};

 };

function addDeliveryCargoRow(){
 const current=Number(window.deliveryVisibleRows||1);
 if(current>=6)return;
 const next=current+1,row=document.getElementById('deliveryCargoRow'+next);
 if(row){
   row.style.display='grid';
   window.deliveryVisibleRows=next;
   const qty=row.querySelector('[name="qty'+next+'"]');
   const model=row.querySelector('[name="model'+next+'"]');
   if(qty)qty.value='1';
   updateDeliveryCargoRowControls();
   recalcDeliveryTotal();
   // Put the cursor straight into the newly created row.
   setTimeout(()=>model?.focus(),0);
   return;
 }
 updateDeliveryCargoRowControls();
}
function removeDeliveryCargoRow(i){
 const current=Math.max(1,Math.min(6,Number(window.deliveryVisibleRows||1)));
 if(current<=1)return;
 if(i<1||i>current)return;
 // Compact subsequent rows upward so the visible rows always remain 1..N.
 for(let n=i;n<current;n++){
   const srcModel=document.querySelector('[name="model'+(n+1)+'"]');
   const srcQty=document.querySelector('[name="qty'+(n+1)+'"]');
   const srcCost=document.querySelector('[name="cost'+(n+1)+'"]');
   const dstModel=document.querySelector('[name="model'+n+'"]');
   const dstQty=document.querySelector('[name="qty'+n+'"]');
   const dstCost=document.querySelector('[name="cost'+n+'"]');
   if(dstModel)dstModel.value=srcModel?.value||'';
   if(dstQty)dstQty.value=srcQty?.value||'1';
   if(dstCost)dstCost.value=srcCost?.value||'';
 }
 const last=document.getElementById('deliveryCargoRow'+current);
 if(last){
   last.style.display='none';
   const model=last.querySelector('[name="model'+current+'"]');
   const qty=last.querySelector('[name="qty'+current+'"]');
   const cost=last.querySelector('[name="cost'+current+'"]');
   if(model)model.value='';
   if(qty)qty.value='1';
   if(cost)cost.value='';
 }
 window.deliveryVisibleRows=current-1;
 updateDeliveryCargoRowControls();
 recalcDeliveryTotal();
}
function updateDeliveryCargoRowControls(){
 const current=Math.max(1,Math.min(6,Number(window.deliveryVisibleRows||1)));
 for(let i=1;i<=6;i++){
   const row=document.getElementById('deliveryCargoRow'+i);
   if(row)row.style.display=i<=current?'grid':'none';
 }
 const add=document.getElementById('addDeliveryCargoRowBtn');
 if(add){
   add.textContent=current>=6?'Максимум 6 рядов':'＋ Добавить следующий ряд';
   add.disabled=current>=6;
 }
}
function resetDeliveryCargoRows(){

function sanitizeManualDeliveryDateInput(input){

 input.value=String(input.value||'').replace(/[^\p{L}\p{N}./-]/gu,'').slice(0,20);
}
function validRuDate(v){return /^\d{2}\.\d{2}\.\d{4}$/.test(String(v||''))}
function recalcDeliveryTotal(){
 const rows=Math.max(1,Math.min(6,Number(window.deliveryVisibleRows||1)));
 let total=0;
 for(let i=1;i<=rows;i++){
   const model=String(document.querySelector('[name="model'+i+'"]')?.value||'').trim();
   const qty=Math.max(1,Number(document.querySelector('[name="qty'+i+'"]')?.value||1));
   const cost=Number(document.querySelector('[name="cost'+i+'"]')?.value||0);
   if(model && Number.isFinite(cost) && cost>=0) total+=cost*qty;
 }
 const out=document.getElementById('deliveryCalculatedTotal');
 if(out)out.value=total>0?total.toFixed(2):'';
 return total;
}

 input.style.background=useToday?'#f1f3f5':'';
 input.style.color=useToday?'#8a8f98':'';

function createDelivery(e){

function viewArchivedSale(id){
 if(state.user?.login!=='admin'){alert('Недостаточно прав');return}
 try{
  const key=String(id);
  const sale=(Array.isArray(state.salesArchive)?state.salesArchive:[]).find(s=>String(s.id)===key);
  if(!sale){alert('Продажа в архиве не найдена');return}
  const saleAccount=canonicalAccount(sale.createdBy,sale.createdByName||sale.createdBy||'');
  const saleCode=normalizeCode(sale.code||'');
  const all=Array.isArray(state.walletArchive)?state.walletArchive:[];
  let rows=[];
  // Главный источник для новых архивов — снимок строк, сохранённый вместе с продажей.
  // Самый надёжный источник — сохранённый снимок конкретной продажи.
  if(Array.isArray(sale.archiveItems)&&sale.archiveItems.length){
    rows=sale.archiveItems.map(x=>({...x}));
  } else if(Array.isArray(sale.walletSnapshot)&&sale.walletSnapshot.length){
    rows=sale.walletSnapshot.map(x=>({...x}));
  }
  // Второй источник — архивные строки с точным saleId или groupId,
  // начинающимся с ID этой продажи. Это позволяет открыть старые архивы.
  if(!rows.length){
    rows=all.filter(r=>String(r.saleId)===key || String(r.groupId||'').startsWith(key+'|')).map(x=>({...x}));
  }
  // Совместимость со старыми архивами без saleId: строго дата + аккаунт + код,
  // затем чек и groupId. Никогда не берём строки, принадлежащие другой продаже.
  if(!rows.length){
    const saleDate=normalizeDate(sale.date||sale.dateISO||sale.dateTime||sale.createdAt||'');
    const candidates=all.filter(r=>{
      if(saleDate && normalizeDate(r.date||r.saleDate||'')!==saleDate)return false;
      const a=canonicalAccount(r.account||'',r.account||'');
      if(saleAccount && a && a!==saleAccount)return false;
      return normalizeCode(r.code||'')===saleCode;
    });
    const primary=candidates.find(r=>r.groupRole==='primary')||candidates[0];
    if(primary){
      const gid=String(primary.groupId||'');
      const receipt=normalizeReceipt(primary.receipt||'');
      rows=all.filter(r=>{
        if(r.saleId)return false;
        if(gid&&String(r.groupId)===gid)return true;
        if(saleDate&&normalizeDate(r.date||r.saleDate||'')!==saleDate)return false;
        if(normalizeReceipt(r.receipt||'')!==receipt)return false;
        const a=canonicalAccount(r.account||'',r.account||'');
        return !saleAccount||!a||a===saleAccount;
      }).map(x=>({...x}));
    }
  }
  if(!rows.length){
    rows=[{date:sale.date||'',receipt:'',code:sale.code||'',product:'',sum:'',quantity:'',rank:'',receiptDuration:'',illiquid:'',supplier:'',services:'',dayTotal:'',terminal:'',it:'',promotions:'',account:sale.createdByName||sale.createdBy||''}];
  }
  rows.sort((a,b)=>{
    const ap=normalizeCode(a.code)===saleCode,bp=normalizeCode(b.code)===saleCode;
    if(ap!==bp)return ap?-1:1;
    return num(b.sum)-num(a.sum);
  });
  const grouped=rows.length>1;
  const rowClass=grouped?(saleAccount==='bosch'?'wallet-bosch-group':saleAccount==='haier'?'wallet-haier-group':'wallet-duplicate'):'';
  const raw=v=>(v===null||v===undefined||v==='')?'':esc(v);
  const tableRows=rows.map(r=>`<tr class="${rowClass}"><td>${raw(r.date)}</td><td>${raw(r.receipt)}</td><td>${raw(r.code)}</td><td>${raw(r.product)}</td><td>${raw(r.sum)}</td><td>${raw(r.quantity)}</td><td>${raw(r.rank)}</td><td>${raw(r.receiptDuration)}</td><td>${raw(r.illiquid)}</td><td>${raw(r.supplier)}</td><td>${raw(r.services)}</td><td>${raw(r.dayTotal)}</td><td>${raw(r.terminal)}</td><td>${raw(r.it)}</td><td>${raw(r.promotions)}</td><td>${raw(r.account||sale.createdByName||sale.createdBy||'')}</td></tr>`).join('');
  const box=document.getElementById('modalBox');
  if(!box)throw new Error('Окно просмотра не найдено');
  box.innerHTML=`<div class="modal-head"><div><h2 style="margin:0">Просмотр архивной продажи</h2><div class="muted">Исходные данные продажи и товары именно этой продажи</div></div><button class="close" onclick="closeModal()">×</button></div>
  <div class="card" style="margin-bottom:14px"><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:10px"><div><b>Код товара:</b> ${esc(sale.code||'')}</div><div><b>Аккаунт:</b> ${esc(sale.createdByName||sale.createdBy||'')}</div><div><b>Дата создания:</b> ${esc(sale.dateTime||sale.date||'')}</div><div><b>Дата архива:</b> ${esc(sale.archivedAt?new Date(sale.archivedAt).toLocaleString('ru-RU'):'')}</div><div><b>Создатель:</b> ${esc(sale.createdByName||sale.createdBy||'')}</div><div><b>ID продажи:</b> ${esc(sale.id)}</div></div></div>
  <div class="wallet-table-wrap archive-view-table"><table class="wallet-table"><thead><tr><th>Дата</th><th>№ чека</th><th>Код товара</th><th>Наименование</th><th>Сумма</th><th>Количество</th><th>Ранг / Бонус</th><th>Дл. чека</th><th>Неликвид</th><th>Поставщик</th><th>Услуги</th><th>Итог дня</th><th>Терминал</th><th>IT</th><th>Акции</th><th>Аккаунт</th></tr></thead><tbody>${tableRows}</tbody></table></div>
  <div class="muted" style="margin-top:10px">Показаны исходные значения Excel без пересчёта бонусов. ${grouped?'Все товары этой продажи в одном чеке выделены одним цветом.':''}</div><div class="form-actions"><button class="btn" onclick="closeModal()">Закрыть</button></div>`;
  openModal();
 }catch(err){console.error(err);alert('Не удалось открыть просмотр архивной продажи: '+(err?.message||err));}
}
function startRestoreArchivedSale(id){
 if(state.user?.login!=='admin'){alert('Недостаточно прав');return}
 const key=String(id),sale=(state.salesArchive||[]).find(s=>String(s.id)===key);if(!sale){alert('Продажа в архиве не найдена');return}
 const timerKey='archive_restore_'+key,btn=document.getElementById('archiveRestoreBtn_'+archiveSafeId(id));if(!btn)return;
 if(deleteTimers[timerKey]){clearInterval(deleteTimers[timerKey].interval);clearTimeout(deleteTimers[timerKey].timeout);delete deleteTimers[timerKey];btn.textContent='Восстановить';btn.classList.remove('active');return}
 let seconds=5;btn.classList.add('active');btn.textContent='Восстановление через '+seconds+' с';
 const interval=setInterval(()=>{seconds--;const b=document.getElementById('archiveRestoreBtn_'+archiveSafeId(id));if(b)b.textContent='Восстановление через '+seconds+' с'},1000);
 const timeout=setTimeout(()=>{
   clearInterval(interval);delete deleteTimers[timerKey];
   const current=(state.salesArchive||[]).find(s=>String(s.id)===key);if(!current)return;
   state.sales=Array.isArray(state.sales)?state.sales:[];state.walletRows=Array.isArray(state.walletRows)?state.walletRows:[];
   if(!state.sales.some(s=>String(s.id)===key))state.sales.unshift({...current,archivedAt:undefined});
   const restored=(state.walletArchive||[]).filter(r=>String(r.saleId)===key).map(r=>{const x={...r};delete x.archivedAt;return x});
   const existingWalletIds=new Set(state.walletRows.map(r=>String(r.id)));
   restored.forEach(r=>{if(r.id==null||!existingWalletIds.has(String(r.id)))state.walletRows.push(r)});
   state.salesArchive=state.salesArchive.filter(s=>String(s.id)!==key);state.walletArchive=(state.walletArchive||[]).filter(r=>String(r.saleId)!==key);
   save();log('Восстановление продажи из архива',current.code||'','',`Продажа восстановлена после 5-секундного таймера. Аккаунт: ${current.createdByName||current.createdBy||''}`);renderArchive(document.getElementById('content'));alert('Продажа восстановлена.');
 },5000);
 deleteTimers[timerKey]={interval,timeout};
}

 let a=state.services.filter(s=>state.user.login==='admin'||s.createdBy===state.user.login).filter(s=>JSON.stringify(s).toLowerCase().includes(q));
 a.sort((x,y)=>sort==='old'?x.createdAt-y.createdAt:y.createdAt-x.createdAt);
 document.getElementById('serviceTable').innerHTML=a.length?`<div class="table-wrap"><table><thead><tr><th>№ сервиса</th><th>Клиент</th><th>IDNP</th><th>Телефон</th><th>Создатель</th><th>Дата</th><th></th></tr></thead><tbody>${a.map(s=>`<tr><td><b>${esc(s.number)}</b></td><td>${esc(s.client)}</td><td>${esc(s.idnp)}</td><td>${esc(s.phone)}</td><td>${esc(s.createdByName)}</td><td>${esc(s.dateTime)}</td><td><div class="actions"><button class="btn small" onclick="openDoc(${s.id})">Открыть документ</button>${can('service.send')?'<button class="btn small primary" onclick="sendDoc('+s.id+')">Отправить</button>':''}${can('service.delete')?'<button id="deleteBtn_'+s.id+'" class="btn small delete-timer" onclick="startDeleteTimer('+s.id+')">Удалить</button>':''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Сервисов пока нет</div>';
}
function startDeleteTimer(id){
 if(!can('service.delete')){alert('Недостаточно прав');return}
 const btn=document.getElementById('deleteBtn_'+id);if(!btn)return;
 if(deleteTimers[id]){
   clearInterval(deleteTimers[id].interval);clearTimeout(deleteTimers[id].timeout);delete deleteTimers[id];
   btn.textContent='Удалить';btn.classList.remove('active');return;
 }
 let seconds=15;btn.classList.add('active');btn.textContent='Удаление через '+seconds+' с';
 const interval=setInterval(()=>{seconds--;const current=document.getElementById('deleteBtn_'+id);if(current)current.textContent='Удаление через '+seconds+' с';},1000);
 const timeout=setTimeout(()=>{
   clearInterval(interval);delete deleteTimers[id];
   const s=state.services.find(x=>x.id===id);if(!s)return;
   state.services=state.services.filter(x=>x.id!==id);
   log('Удаление сервиса',s.number,s.number,'Сервис удалён после 15-секундного таймера');save();
   if(document.getElementById('serviceTable'))filterServices();
 },15000);
 deleteTimers[id]={interval,timeout};
}
function fillConsultantSuggestions(){
  const dl=document.getElementById('consultantSuggestions');
  if(!dl)return;
  const names=[...new Set(state.services.map(x=>String(x.consultant||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));
  dl.innerHTML=names.map(name=>`<option value="${esc(name)}"></option>`).join('');
}
function newService(){document.getElementById('modalBox').innerHTML=`<div class="modal-head"><div><h2 style="margin:0">Создание сервиса</h2><div class="muted">Заполните данные заявки</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createService(event)"><div class="form-grid">
<div><label>Codul de la buletin B/A/EA</label><input name="cod" required autofocus></div>
<div><label>Nume/Prenume Client</label><input name="client" required></div>
<div><label>Numărul de Identitate / IDNP</label><input name="idnp" required pattern="[0-9A-Za-z-]{5,30}"></div>
<div class="full"><label>Adresa</label><input name="address" required></div>
<div><label>Numărul de Telefon</label><input name="phone" required></div>
<div><label>Consultant</label><input name="consultant" required list="consultantSuggestions" autocomplete="off" placeholder="Începeți să scrieți..."><datalist id="consultantSuggestions"></datalist></div>
<div class="full"><label>Denumirea, Marca, S/N</label><input name="product" required></div>
<div class="full"><label>În legătură cu</label><textarea name="relation" rows="2" required></textarea></div>
<div class="full"><label>Starea exterioară</label><textarea name="state" rows="2" required>Uzat</textarea></div>
<div class="full"><label>Complectația adăugătoare</label><textarea name="extra" rows="3"></textarea></div>
</div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Отмена</button><button class="btn primary">Создать Документ</button></div></form>`;fillConsultantSuggestions();openModal()}function createService(e){e.preventDefault();let f=new FormData(e.target),now=new Date(),id=Date.now(),number='AV-'+now.getFullYear()+'-'+String(state.services.length+1).padStart(5,'0');let s={id,number,cod:f.get('cod'),idnp:f.get('idnp'),client:f.get('client'),consultant:f.get('consultant'),address:f.get('address'),phone:f.get('phone'),product:f.get('product'),relation:f.get('relation'),state:f.get('state'),extra:f.get('extra'),createdBy:state.user.login,createdByName:state.user.name,createdAt:id,date:now.toLocaleDateString('ru-RU'),dateTime:now.toLocaleString('ru-RU')};state.services.unshift(s);fillConsultantSuggestions();log('Создание сервиса',number,number,'Создана новая заявка');save();closeModal();renderService(document.getElementById('content'))}
function sendDoc(id){let s=state.services.find(x=>x.id===id);log('Отправка документа',s.number,s.number,'Документ подготовлен к отправке');save();alert('Документ подготовлен к отправке. Канал отправки можно подключить позже.')}
function openDoc(id){currentDocId=id;renderDocument(id,false)}
function openDocLayout(id){if(state.user.login!=='admin'){alert('Недостаточно прав');return}currentDocId=id;renderDocument(id,true)}
function renderDocument(id,edit=false){let s=state.services.find(x=>x.id===id);if(!s)return;document.getElementById('content').innerHTML=`<div class="doc-toolbar"><button class="btn" onclick="navigate('service')">← Назад</button>${can('service.print')?'<button class="btn primary" onclick="window.print()">Печать</button>':''}${can('service.send')?'<button class="btn" onclick="sendDoc('+s.id+')">Отправить документ</button>':''}${state.user.login==='admin'&&edit?'<button class="btn" onclick="openDoc('+s.id+')">Готово</button>':''}</div><div class="document-shell"><div class="document-page" id="documentPage"><img src="${IMG_B64}">${Object.keys(getLayout()).map(k=>renderDocField(s,k,edit)).join('')}</div></div>${edit?layoutEditor(s):''}${edit?'<div class="layout-hint">Перетаскивайте поля мышкой прямо по бланку. Настройки сохраняются как стандарт для всех пользователей.</div>':''}`;if(edit)enableDrag();log(edit?'Открытие редактора бланка':'Открытие документа',s.number,s.number);save()}
function layoutEditor(s){let l=getLayout();return `<div class="field-editor"><h3>Настройка бланка</h3><div class="muted" style="font-size:11px;margin-bottom:8px">Изменения являются общим стандартом и применяются ко всем пользователям и документам.</div>${Object.entries(l).map(([k,x])=>`<div class="field-row"><b>${esc(x.label)}</b><div class="field-controls"><label>X (%)<input type="number" step="0.1" value="${x.x}" oninput="updateLayout('${k}','x',this.value)"></label><label>Y (%)<input type="number" step="0.1" value="${x.y}" oninput="updateLayout('${k}','y',this.value)"></label><label>Размер (pt)<input type="number" min="5" max="48" step="0.5" value="${x.size}" oninput="updateLayout('${k}','size',this.value)"></label><label>Шрифт<select onchange="updateLayout('${k}','font',this.value)"><option ${x.font==='Arial'?'selected':''}>Arial</option><option ${x.font==='Times New Roman'?'selected':''}>Times New Roman</option><option ${x.font==='Georgia'?'selected':''}>Georgia</option><option ${x.font==='Verdana'?'selected':''}>Verdana</option><option ${x.font==='Tahoma'?'selected':''}>Tahoma</option></select></label></div></div>`).join('')}<div class="editor-actions"><button class="btn" onclick="resetTemplateLayout()">Сбросить стандарт</button><button class="btn primary" onclick="saveTemplateLayout()">Сохранить стандарт</button></div></div>`}

function enableDrag(){const page=document.getElementById('documentPage');if(!page)return;document.querySelectorAll('.doc-field.doc-edit').forEach(el=>{el.style.cursor='move';el.onpointerdown=function(ev){ev.preventDefault();el.setPointerCapture(ev.pointerId);const rect=page.getBoundingClientRect(),startX=ev.clientX,startY=ev.clientY,l0=getLayout()[el.dataset.key],ox=l0.x,oy=l0.y;function move(e){const nx=Math.max(0,Math.min(100,ox+(e.clientX-startX)/rect.width*100)),ny=Math.max(0,Math.min(100,oy+(e.clientY-startY)/rect.height*100));el.style.left=nx+'%';el.style.top=ny+'%';let l=getLayout();l[el.dataset.key].x=Number(nx.toFixed(2));l[el.dataset.key].y=Number(ny.toFixed(2));saveLayout(l);let xi=document.getElementById('x_'+el.dataset.key),yi=document.getElementById('y_'+el.dataset.key);if(xi)xi.value=nx.toFixed(2);if(yi)yi.value=ny.toFixed(2)}function up(){el.releasePointerCapture(ev.pointerId);el.onpointermove=null;el.onpointerup=null;save()}el.onpointermove=move;el.onpointerup=up}})}

const IMG_B64='assets/service-template.png';
const TEMPLATE_VERSION='2026-09-12-high-quality-form-v1';
if(localStorage.getItem('av_template_background_version')!==TEMPLATE_VERSION){localStorage.setItem('av_template_background',IMG_B64);localStorage.setItem('av_template_background_version',TEMPLATE_VERSION);}
function renderLogs(c){c.innerHTML=`<div class="page-head"><div><h1>Логи</h1><div class="muted">Журнал действий пользователей</div></div></div><div class="table-card"><div class="toolbar"><input id="logSearch" placeholder="Поиск..." oninput="filterLogs()"><select id="logType" onchange="filterLogs()"><option value="">Все действия</option><option>Вход в систему</option><option>Создание сервиса</option><option>Открытие документа</option><option>Отправка документа</option></select></div><div id="logsTable"></div></div>`;filterLogs()}
function filterLogs(){let q=(document.getElementById('logSearch')?.value||'').toLowerCase(),t=document.getElementById('logType')?.value||'';let a=state.logs.filter(x=>(!t||x.action===t)&&JSON.stringify(x).toLowerCase().includes(q));document.getElementById('logsTable').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Дата/время</th><th>Пользователь</th><th>Действие</th><th>Объект</th><th>Сервис</th><th>Детали</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.object)}</td><td>${esc(x.service||'—')}</td><td>${esc(x.details||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function renderPermissions(c){c.innerHTML=`<div class="page-head"><div><h1>Права</h1><div class="muted">Управление разрешениями системы</div></div><button class="btn primary" onclick="addPermission()">＋ Создать право</button></div><div class="table-card"><table><thead><tr><th>Название</th><th>Ключ</th><th></th></tr></thead><tbody>${state.permissions.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td><code>${esc(p.key)}</code></td><td><button class="btn small" onclick="editPermission(${p.id})">Изменить</button></td></tr>`).join('')}</tbody></table></div>`}
function addPermission(){let name=prompt('Название права:');if(!name)return;let key=prompt('Ключ, например service.delete:');if(!key)return;state.permissions.push({id:Date.now(),name,key});save();renderPermissions(document.getElementById('content'));log('Создание права',name)}
function editPermission(id){let p=state.permissions.find(x=>x.id===id);let n=prompt('Название права:',p.name);if(n){let old=p.name;p.name=n;save();log('Изменение права',p.key,'',`Было: ${old}; Стало: ${n}`);renderPermissions(document.getElementById('content'))}}
function renderGroups(c){c.innerHTML=`<div class="page-head"><div><h1>Группы</h1><div class="muted">Роли и наборы разрешений</div></div><button class="btn primary" onclick="addGroup()">＋ Создать группу</button></div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${state.groups.map(g=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(g.name)}</b><button class="btn small" onclick="editGroup(${g.id})">Изменить</button></div><p class="muted">${esc(g.desc)}</p><div class="checkbox-list">${state.permissions.slice(0,6).map(p=>`<label class="check"><input type="checkbox" ${g.name==='Владельцы'||(g.permissions||[]).includes(p.key)?'checked':''} onchange="toggleGroupPerm(${g.id},'${p.key}',this.checked)"> ${esc(p.name)}</label>`).join('')}</div></div>`).join('')}</div>`}
function addGroup(){let name=prompt('Название группы:');if(!name)return;state.groups.push({id:Date.now(),name,desc:'Новая группа',permissions:[]});save();renderGroups(document.getElementById('content'));log('Создание группы',name)}
function editGroup(id){let g=state.groups.find(x=>x.id===id),n=prompt('Название группы:',g.name);if(n){let old=g.name;g.name=n;save();log('Изменение группы',n,'',`Было: ${old}; Стало: ${n}`);renderGroups(document.getElementById('content'))}}
function toggleGroupPerm(id,key,on){let g=state.groups.find(x=>x.id===id);g.permissions=g.permissions||[];g.permissions=on?[...new Set([...g.permissions,key])]:g.permissions.filter(x=>x!==key);save();log('Изменение прав группы',g.name,'',`${key}: ${on?'разрешено':'запрещено'}`)}
function renderUsers(c){
 const allPerms=Array.isArray(state.permissions)?state.permissions:[];
 c.innerHTML=`<div class="page-head"><div><h1>Пользователи</h1><div class="muted">Изменение названия, логина, пароля и прав доступа</div></div><button class="btn primary" onclick="addUser()">＋ Добавить пользователя</button></div><div class="table-card"><table><thead><tr><th>Название</th><th>Логин</th><th>Группа</th><th>Права</th><th>Статус</th><th>Создан</th><th>Последняя активность</th><th></th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.login)}</td><td>${esc(u.group||'')}</td><td>${Array.isArray(u.permissions)?u.permissions.length:0} / ${allPerms.length}</td><td><span class="badge ${u.status==='Активен'?'ok':'off'}">${esc(u.status||'Активен')}</span></td><td>${esc(u.created||'')}</td><td>${esc(u.last||'')}</td><td><button class="btn small" onclick="editUser(${JSON.stringify(u.id)})">Управлять</button></td></tr>`).join('')}</tbody></table></div>`;
}
function addUser(){const id=Date.now();state.users.push({id,name:'Новый пользователь',login:'user'+id,group:'Сотрудники',status:'Активен',created:new Date().toLocaleDateString('ru-RU'),last:'—',password:'',permissions:[]});save();editUser(id)}
function editUser(id){
 if(state.user?.login!=='admin'){alert('Недостаточно прав');return}
 const u=state.users.find(x=>String(x.id)===String(id));if(!u)return; const perms=Array.isArray(state.permissions)?state.permissions:[]; const checked=new Set(Array.isArray(u.permissions)?u.permissions:[]); const isAdmin=u.login==='admin'; const safe=String(id).replace(/[^A-Za-z0-9_-]/g,'_');
 const ph=perms.map(p=>`<label style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid #eef0f3"><input type="checkbox" class="user-perm" value="${esc(p.key)}" ${checked.has(p.key)?'checked':''} ${isAdmin?'disabled':''} style="width:auto"><span><b>${esc(p.name)}</b><br><code>${esc(p.key)}</code></span></label>`).join('');
 document.getElementById('modalBox').innerHTML=`<div class="modal-head"><div><h2 style="margin:0">Управление пользователем</h2><div class="muted">Название, логин, пароль и права</div></div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><label>Название<input id="eu_name_${safe}" value="${esc(u.name||'')}"></label><label>Логин<input id="eu_login_${safe}" value="${esc(u.login||'')}"></label><label>Пароль<input id="eu_pass_${safe}" type="password" value="${esc(u.password||'')}"></label><label>Группа<input id="eu_group_${safe}" value="${esc(u.group||'')}"></label><label>Статус<select id="eu_status_${safe}"><option value="Активен" ${u.status==='Активен'?'selected':''}>Активен</option><option value="Неактивен" ${u.status!=='Активен'?'selected':''}>Неактивен</option></select></label></div><div class="card" style="margin-top:16px"><h3 style="margin-top:0">Права доступа</h3><div style="max-height:320px;overflow:auto">${ph||'<div class="muted">Права ещё не созданы.</div>'}</div>${isAdmin?'<div class="muted" style="margin-top:10px">Администратор имеет все права.</div>':''}</div><div class="form-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="saveEditedUser(${JSON.stringify(u.id)})">Сохранить</button></div>`;openModal();
}
function saveEditedUser(id){
 const u=state.users.find(x=>String(x.id)===String(id));if(!u)return;const safe=String(id).replace(/[^A-Za-z0-9_-]/g,'_');const name=document.getElementById('eu_name_'+safe)?.value.trim();const login=document.getElementById('eu_login_'+safe)?.value.trim();const password=document.getElementById('eu_pass_'+safe)?.value||'';const group=document.getElementById('eu_group_'+safe)?.value.trim();const status=document.getElementById('eu_status_'+safe)?.value||'Активен';
 if(!name||!login||!password){alert('Название, логин и пароль обязательны.');return} if(state.users.some(x=>String(x.id)!==String(id)&&x.login===login)){alert('Такой логин уже используется.');return}
 const old=`${u.name} / ${u.login}`;u.name=name;u.login=login;u.password=password;u.group=group;u.status=status;u.permissions=login==='admin'?state.permissions.map(x=>x.key):[...document.querySelectorAll('.user-perm:checked')].map(x=>x.value);
 if(state.user&&String(state.user.id)===String(id)){state.user={...u,permissions:[...u.permissions]};document.getElementById('sideName').textContent=u.name;document.getElementById('sideRole').textContent=u.group||''}
 save();log('Изменение пользователя',u.login,'',`Было: ${old}; Стало: ${u.name} / ${u.login}; Изменены пароль и права доступа.`);closeModal();renderUsers(document.getElementById('content'));
}
function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleString('ru-RU'),1000);
</script>
